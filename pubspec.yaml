name: collapse_risk_tracker
description: Collapse-Risk Building Follow-Up System — Municipality of Tripoli.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.3
  firebase_storage: ^12.3.2

  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7
  google_fonts: ^6.2.1

  # Added for the fully-functional Parcels screen:
  google_maps_flutter: ^2.9.0 # location display (lat/lng map + marker)
  url_launcher: ^6.3.0 # "Open in Google Maps" external link
  file_picker: ^8.1.2 # already in use by the team's attachment upload

  intl: ^0.19.0
  equatable: ^2.0.5
  cupertino_icons: ^1.0.8
  image_picker: ^1.1.2
  video_player: ^2.9.2
  pdf: ^3.11.1
  excel: ^4.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/Cairo-Regular.ttf
    - assets/fonts/Cairo-Bold.ttf
    - assets/logo/logo.jpg
