<!DOCTYPE html>
<!-- No dir="rtl" here: Flutter handles RTL itself, and an RTL document
     mispositions platform views (the Google Map renders off-screen). -->
<html lang="ar">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="نظام متابعة المباني الآيلة للسقوط — بلدية طرابلس">
  <meta name="theme-color" content="#1B2A4A">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="متابعة المباني">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>نظام متابعة المباني الآيلة للسقوط — بلدية طرابلس</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBbfH55Uq1JSSm4mc1CuNkdbZdtRUTNQAQ"></script>

  <style>
    /* Branded splash shown while the Flutter engine loads; removed on the
       first rendered frame. */
    #splash {
      position: fixed; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px;
      background: #ffffff;
      transition: opacity .35s ease;
      z-index: 9999;
    }
    #splash img { height: 180px; width: auto; }
    #splash .bar {
      width: 120px; height: 3px; border-radius: 3px; overflow: hidden;
      background: #e6e9ef;
    }
    #splash .bar::after {
      content: ""; display: block; width: 40%; height: 100%;
      background: #1B2A4A; border-radius: 3px;
      animation: splash-load 1.1s ease-in-out infinite;
    }
    @keyframes splash-load {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(250%); }
    }
    #splash.hidden { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <div id="splash">
    <img src="icons/splash-logo.png" alt="شعار بلدية طرابلس">
    <div class="bar"></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (!splash) return;
      splash.classList.add('hidden');
      setTimeout(function () { splash.remove(); }, 400);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
